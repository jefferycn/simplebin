<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SimpleBin">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="/static/manifest.json">
<link rel="apple-touch-icon" href="/static/icon-180.png">
<title>历史 - SimpleBin</title>
<link rel="stylesheet" href="/static/app.css">
<link rel="stylesheet" href="/static/vendor/photoswipe.css">
</head>
<body>
<header class="topbar">
  <button class="burger" id="burgerBtn" aria-label="菜单"><span></span><span></span><span></span></button>
  <a class="brand" href="/">SimpleBin</a>
  <div class="topbar-actions">
    <a class="icon-btn" href="/new" aria-label="新建">＋</a>
  </div>
</header>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="菜单">
  <div class="drawer-head">
    <div class="logo">SimpleBin</div>
    <div class="sub">剪贴板</div>
  </div>
  <nav>
    <a class="drawer-item" data-nav="home" href="/">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
      首页</a>
    <a class="drawer-item" data-nav="history" href="/history">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
      历史<span class="count" id="historyCount"></span></a>
    <a class="drawer-item" data-nav="settings" href="/settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      设置</a>
    <a class="drawer-item" data-nav="admin" href="/admin" id="adminLink" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      管理</a>
  </nav>
  <div class="drawer-foot">
    <button class="drawer-item danger" id="logoutBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
      登出</button>
  </div>
</aside>
<main>
  <h1>历史记录</h1>
  <div class="filters">
    <input type="search" id="q" placeholder="搜索标题 / 内容…">
    <select id="typeFilter">
      <option value="all">全部类型</option>
      <option value="text">文本</option>
      <option value="link">链接</option>
      <option value="image">图片</option>
      <option value="file">文件</option>
    </select>
    <select id="sortSelect">
      <option value="newest">最新优先</option>
      <option value="oldest">最旧优先</option>
      <option value="size">按大小</option>
      <option value="type">按类型</option>
    </select>
  </div>
  <div id="list"><p class="muted">加载中…</p></div>
  <div class="pager" id="pager"></div>
  <p class="stats" id="stats"></p>
</main>
<div id="toast"></div>
<script src="/static/app.js"></script>
<script src="/static/history.js"></script>
<script type="module" src="/static/viewer.js"></script>
</body>
</html>

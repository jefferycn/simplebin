<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SimpleBin">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="/static/manifest.json">
<link rel="apple-touch-icon" href="/static/icon-180.png">
<title>新建 - SimpleBin</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="/">SimpleBin</a>
  <nav>
    <a href="/">首页</a>
    <a href="/history">历史</a>
    <a href="/settings">设置</a>
    <a href="/admin" id="adminLink" hidden>管理</a>
    <button class="linkbtn" id="logoutBtn">登出</button>
  </nav>
</header>
<main>
  <h1>新建条目</h1>
  <div class="paste-box">
    <textarea id="pasteText" placeholder="粘贴或输入文本，粘贴后自动保存…" autofocus></textarea>
    <p><button class="btn primary big" id="saveTextBtn">保存</button></p>
    <div class="dropzone" id="dropzone">拖拽文件到这里上传，或 <label class="linkbtn" for="fileInput" style="cursor:pointer">选择文件</label>
      <input type="file" id="fileInput" hidden>
      <div class="muted" style="font-size:13px;margin-top:4px">粘贴文本后自动保存；页面内 Ctrl+V / ⌘V 可直接粘贴图片</div>
    </div>
  </div>
</main>
<div id="toast"></div>
<script src="/static/app.js"></script>
<script src="/static/new.js"></script>
</body>
</html>
